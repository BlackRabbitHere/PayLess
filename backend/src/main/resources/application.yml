spring:
  application:
    name: payment-optimizer
  profiles:
    default: local
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

scraper:
  base-url: ${SCRAPER_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: ${SCRAPER_CONNECT_TIMEOUT:5s}
  read-timeout: ${SCRAPER_READ_TIMEOUT:30s}
  allow-fixtures: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
