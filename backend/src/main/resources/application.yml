spring:
  application:
    name: payment-optimizer
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:15432/payment_optimizer}
    username: ${DATABASE_USERNAME:payment_optimizer}
    password: ${DATABASE_PASSWORD:local-development-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

scraper:
  base-url: ${SCRAPER_BASE_URL:http://127.0.0.1:8000}
  connect-timeout: ${SCRAPER_CONNECT_TIMEOUT:5s}
  read-timeout: ${SCRAPER_READ_TIMEOUT:30s}
  allow-fixtures: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  structured:
    format:
      console: logstash
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
