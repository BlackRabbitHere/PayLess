name: payment-optimizer
services:
  scraper:
    build:
      context: ./scraper
    environment:
      APP_ENV: docker
      FIXTURE_DIR: ${SCRAPER_FIXTURE_DIR:-/app/fixtures}
      DATA_DIR: /app/data
      PLAYWRIGHT_ENABLED: "false"
      SAVE_RAW_HTML: "false"
    volumes:
      - ./scraper/tests/fixtures:/app/fixtures:ro
      - scraper-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SCRAPER_BASE_URL: ${SCRAPER_BASE_URL:-http://scraper:8000}
      SCRAPER_CONNECT_TIMEOUT: ${SCRAPER_CONNECT_TIMEOUT:-5s}
      SCRAPER_READ_TIMEOUT: ${SCRAPER_READ_TIMEOUT:-30s}
      SCRAPER_ALLOW_FIXTURES: ${SCRAPER_ALLOW_FIXTURES:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      scraper:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  scraper-data:
