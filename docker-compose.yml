name: payment-optimizer
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payment_optimizer
      POSTGRES_USER: payment_optimizer
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_optimizer -d payment_optimizer"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  scraper:
    build:
      context: ./scraper
    environment:
      APP_ENV: docker
      FIXTURE_DIR: ${SCRAPER_FIXTURE_DIR-/app/fixtures}
      DATA_DIR: /app/data
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-false}
      TERMS_REVIEWED_PROVIDERS: ${TERMS_REVIEWED_PROVIDERS:-}
      SAVE_RAW_HTML: "false"
    volumes:
      - ./scraper/tests/fixtures:/app/fixtures:ro
      - scraper-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped
  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DATABASE_URL: jdbc:postgresql://postgres:5432/payment_optimizer
      DATABASE_USERNAME: payment_optimizer
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-development-only}
      SCRAPER_BASE_URL: http://scraper:8000
      SCRAPER_CONNECT_TIMEOUT: ${SCRAPER_CONNECT_TIMEOUT:-5s}
      SCRAPER_READ_TIMEOUT: ${SCRAPER_READ_TIMEOUT:-30s}
      SCRAPER_ALLOW_FIXTURES: ${SCRAPER_ALLOW_FIXTURES:-true}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      scraper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  smoke:
    image: python:3.12-alpine
    profiles: [smoke]
    volumes:
      - ./scripts/smoke.py:/smoke.py:ro
    command: ["python", "/smoke.py", "http://frontend:5173"]
    depends_on:
      frontend:
        condition: service_healthy
volumes:
  scraper-data:
  postgres-data:
