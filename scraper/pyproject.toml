[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-scraper"
version = "0.1.0"
description = "Independent, deterministic public offer collection service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5", "lxml>=5.3,<7", "playwright>=1.51,<2",
  "uvicorn>=0.34,<1", "python-dotenv>=1,<2", "tenacity>=9,<10", "tzdata>=2025.1"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "pytest-playwright>=0.7,<1", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
payment-scraper = "payment_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not live and not browser'"
markers = [
  "live: opt-in public-provider integration tests (network required)",
  "browser: opt-in real Chromium runtime tests (controlled in-memory pages, no provider access)",
]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
