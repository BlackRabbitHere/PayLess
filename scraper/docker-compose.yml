services:
  scraper:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCRAPER_USER_AGENT: ${SCRAPER_USER_AGENT:-PaymentRouteOptimizer/0.1}
      TERMS_REVIEWED_PROVIDERS: ${TERMS_REVIEWED_PROVIDERS:-}
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
      PROVIDER_YATRA_ENABLED: ${PROVIDER_YATRA_ENABLED:-true}
      PROVIDER_GYFTR_ENABLED: ${PROVIDER_GYFTR_ENABLED:-true}
      PROVIDER_EASEMYTRIP_ENABLED: ${PROVIDER_EASEMYTRIP_ENABLED:-true}
      MAX_RETRIES: ${MAX_RETRIES:-0}
      DATA_DIR: /app/data
    volumes:
      - scraper-data:/app/data
    init: true
    shm_size: 256mb
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  scraper-data:
