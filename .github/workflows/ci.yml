name: Fixture CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen scraper and contract baseline
        run: python scripts/verify-frozen-scraper.py
      - name: Start isolated PostgreSQL
        run: docker compose up -d --wait postgres
      - name: Backend unit, controller, fixture integration, and PostgreSQL tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -Pdatabase-tests package
      - name: Frontend types, lint, unit, hook, and component tests
        working-directory: frontend
        run: |
          npm ci
          npm run check
          VITE_API_BASE_URL='' npm run build
      - name: Scraper offline tests only
        working-directory: scraper
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps .
          python -m pip install 'pytest>=8.3,<10' 'httpx>=0.28,<1'
          python -m pytest
      - name: Critical browser flows with saved FastAPI responses
        working-directory: frontend
        run: |
          npx playwright install --with-deps chrome
          npm run test:e2e
      - name: Full Compose fixture smoke
        run: |
          docker compose up -d --build --wait
          docker compose --profile smoke run --rm smoke
      - name: Collect container diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop ephemeral CI stack
        if: always()
        run: docker compose down -v
